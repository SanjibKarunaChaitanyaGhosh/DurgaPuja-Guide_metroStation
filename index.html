<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sanjib Ghosh's Pujo Metro Guide | সঞ্জীব ঘোষের পুজো মেট্রো রুট</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="Style.css">
</head>
<body>
<header>
  <h1 data-k="title"></h1>
  <div class="by">🌸 <span data-k="by"></span></div>
  <div class="sub" data-k="sub"></div>
</header>
<div class="w safe"><details open>
  <summary>🛡️ <span data-k="safe"></span></summary>
  <div class="chk" id="chk"></div><ul id="tips"></ul><div class="emg" id="emg"></div>
</details></div>
<div class="bar"><div class="w">
  <input id="q" type="search">
  <div class="lang"><button data-l="en">EN</button><button data-l="bn">বাং</button></div>
</div></div>
<main class="w">
  <div class="hint" data-k="hint"></div>
  <div class="hint" id="stat"></div>
  <div class="route" id="route"></div>
</main>
<footer><div>🌺 <span data-k="foot"></span> 🌺</div><div data-k="disc"></div></footer>
<div id="tray" class="tray hide">
  <div class="trow"><b>🧭 <span data-k="trip"></span> · <span id="cnt">0</span> <span data-k="stops"></span></b><button id="clr" type="button" data-k="clear"></button></div>
  <div class="lst" id="lst"></div>
  <div class="trow"><select id="mode"><option value="walking"></option><option value="driving"></option><option value="bicycling"></option></select><label><input type="checkbox" id="ord" checked> <span data-k="ord"></span></label><a id="go" class="go" target="_blank" rel="noopener">▶ <span data-k="go"></span></a></div>
  <div class="rem" data-k="rem"></div><div class="rem" id="msg"></div>
</div>
<script src="Script.js"></script>
</body>
</html>
